name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  api:
    name: API Tests
    runs-on: ubuntu-latest
    # Only run if api files changed
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'apps/api')
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for API changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep "^apps/api/" || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 | grep "^apps/api/" || true)
          fi
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.12
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        if: steps.changes.outputs.changed == 'true'
        run: |
          ruff check .

      - name: Run unit tests
        if: steps.changes.outputs.changed == 'true'
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret-key-for-ci
          CORS_ORIGINS: "*"
        run: |
          pytest tests/ -v

  web:
    name: Web Build & Lint
    runs-on: ubuntu-latest
    # Only run if web files changed
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'apps/web')
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Web changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep "^apps/web/" || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 | grep "^apps/web/" || true)
          fi
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js 20
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm install

      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint

      - name: Type check
        if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: npm run build
